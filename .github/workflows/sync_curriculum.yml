name: BIA Weekly Curriculum & Recordings Sync

on:
  schedule:
    # Runs every Monday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-curriculum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run BIA Curriculum Sync
        env:
          BIA_EMAIL: ${{ secrets.BIA_EMAIL || 'pralayasimha@yahoo.com' }}
          BIA_PASSWORD: ${{ secrets.BIA_PASSWORD || 'SrijaSimha@143' }}
          BIA_LOGIN_URL: ${{ secrets.BIA_LOGIN_URL || 'https://campusconnect.bostoninstituteofanalytics.org/' }}
          BIA_CALENDAR_URL: ${{ secrets.BIA_CALENDAR_URL || 'https://campusconnect.bostoninstituteofanalytics.org/academic-calendar' }}
        run: |
          python sync_curriculum.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons/ curriculum_data.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit. Curriculum is already up-to-date."
          else
            git commit -m "chore(sync): automated weekly curriculum update [$(date +'%Y-%m-%d')]"
            git push
          fi
